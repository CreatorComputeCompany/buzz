app = "imabird-buzz-web-api"
primary_region = "lhr"

[build]
  dockerfile = "../../web-api/Dockerfile"

[env]
  BETTER_AUTH_URL = "https://buzz-web-alpha.vercel.app"
  BUZZ_ORCA_ACCESS_MODE = "authenticated"
  NODE_ENV = "production"
  PORT = "3000"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [http_service.concurrency]
    type = "requests"
    soft_limit = 100
    hard_limit = 200

[checks]
  [checks.liveness]
    port = 3000
    type = "http"
    method = "get"
    path = "/_liveness"
    interval = "15s"
    timeout = "3s"
    grace_period = "30s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
